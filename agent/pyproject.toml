[project]
name = "nutriahorro-agent"
version = "0.1.0"
description = "Agente de nutricion, despensa y ahorro para AgentCore."
requires-python = ">=3.14,<3.15"
dependencies = [
  "bedrock-agentcore>=1.22.0,<2.0.0",
  "boto3>=1.43.72,<2.0.0",
  "strands-agents[openai]>=1.48.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "data/*.json"]
